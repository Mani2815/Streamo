  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Streamo logo"
>
  <title>Streamo</title>

  <!-- Pipeline Layers Icon -->
  <g transform="translate(10 27)">
    <rect x="0" y="0" width="45" height="14" rx="7" fill="#0D9488" />
    <rect x="25" y="26" width="60" height="14" rx="7" fill="#0F172A" />
    <rect x="0" y="52" width="35" height="14" rx="7" fill="#64748B" />
  </g>

  <!-- Wordmark -->
  <text
